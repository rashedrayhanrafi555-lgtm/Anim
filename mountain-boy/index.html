<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Boy in the Mountains — Low Poly 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
  #app { width: 100%; height: 100%; }
  .bar { position: fixed; left: 0; right: 0; height: 7.5%; background: #000; z-index: 5; }
  #barTop { top: 0; } #barBot { bottom: 0; }
  #vignette {
    position: fixed; inset: 7.5% 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.38) 100%);
  }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; transition: opacity 1.1s ease; z-index: 7; pointer-events: none; }
  #start {
    position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(4, 8, 18, .82);
    cursor: pointer; user-select: none;
  }
  #start h1 { color: #ffd76a; font: 800 44px/1.2 system-ui, sans-serif; letter-spacing: 4px; margin: 0 0 10px; text-shadow: 0 4px 20px rgba(0,0,0,.7); }
  #start p { color: #cfe0ff; font: 500 16px/1.6 system-ui, sans-serif; opacity: .85; }
  #playBtn {
    margin-top: 26px; padding: 14px 42px; border-radius: 999px; border: 2px solid #ffd76a;
    color: #ffd76a; font: 700 18px system-ui, sans-serif; letter-spacing: 2px; background: transparent;
    cursor: pointer; transition: background .2s, color .2s;
  }
  #playBtn:hover { background: #ffd76a; color: #10203c; }
  #shotLabel {
    position: fixed; left: 24px; bottom: calc(7.5% + 18px); z-index: 6; pointer-events: none;
    color: #ffd76a; font: 600 13px/1 system-ui, sans-serif; letter-spacing: 3px;
    text-transform: uppercase; opacity: 0; transition: opacity .8s; text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  #hint {
    position: fixed; right: 24px; bottom: calc(7.5% + 18px); z-index: 6; pointer-events: none;
    color: #9fb4d8; font: 500 12px/1 system-ui, sans-serif; letter-spacing: 1px; opacity: .8;
  }
</style>
<script type="importmap">
  { "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="barTop" class="bar"></div>
<div id="barBot" class="bar"></div>
<div id="vignette"></div>
<div id="shotLabel"></div>
<div id="hint">click: change shot &nbsp;·&nbsp; M: mute</div>
<div id="fade"></div>
<div id="start">
  <h1>THE BOY IN THE MOUNTAINS</h1>
  <p>A low-poly journey &nbsp;·&nbsp; soft ambient music</p>
  <button id="playBtn">▶ &nbsp;START JOURNEY</button>
</div>
<audio id="bgm" loop preload="auto" src="./music.mp3"></audio>

<script type="module">
import * as THREE from "three";

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById("app").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x9fd8f5, 55, 230);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 8, 26);

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x40684a, 1.05));
const sun = new THREE.DirectionalLight(0xfff1c4, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
scene.add(sun);
scene.add(sun.target);

/* ---------------- terrain ---------------- */
function hashv(x, z) {
  const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function smoothNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hashv(xi, zi), b = hashv(xi + 1, zi), c = hashv(xi, zi + 1), d = hashv(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function heightAt(x, z) {
  let h = 0, amp = 1, f = 0.028;
  for (let o = 0; o < 4; o++) {
    h += amp * smoothNoise(x * f + 13.7, z * f + 7.3);
    amp *= 0.5; f *= 2.15;
  }
  h = (h / 1.875) * 10 - 2.2;
  const d = Math.hypot(x, z);
  if (d > 55) h += (d - 55) * 0.16 * (1 + smoothNoise(x * 0.05, z * 0.05) * 0.9);
  return h;
}

const TSIZE = 380, TSEG = 190;
const tGeo = new THREE.PlaneGeometry(TSIZE, TSIZE, TSEG, TSEG);
tGeo.rotateX(-Math.PI / 2);
{
  const pos = tGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const grass = new THREE.Color(0x55b368);
  const meadow = new THREE.Color(0x7ccf6f);
  const rock = new THREE.Color(0x8b93a6);
  const dark = new THREE.Color(0x5f6c82);
  const snow = new THREE.Color(0xf4f8fd);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = heightAt(x, z);
    pos.setY(i, y);
    const n = smoothNoise(x * 0.31, z * 0.31);
    if (y > 10.5) c.copy(snow);
    else if (y > 6.5) c.lerpColors(rock, snow, Math.min(1, (y - 6.5) / 4)).lerp(dark, n * 0.25);
    else if (y > 2.6) c.lerpColors(meadow, rock, Math.min(1, (y - 2.6) / 3.9)).lerp(dark, n * 0.14);
    else c.lerpColors(grass, meadow, n);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  tGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  tGeo.computeVertexNormals();
}
const terrain = new THREE.Mesh(tGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, flatShading: true, roughness: 0.95, metalness: 0
}));
terrain.receiveShadow = true;
scene.add(terrain);

/* ---------------- path (closed loop) ---------------- */
const pathPts = [
  new THREE.Vector3(0, 0, 0), new THREE.Vector3(14, 0, -10),
  new THREE.Vector3(30, 0, -16), new THREE.Vector3(40, 0, -2),
  new THREE.Vector3(34, 0, 12), new THREE.Vector3(44, 0, 24),
  new THREE.Vector3(28, 0, 34), new THREE.Vector3(8, 0, 30),
  new THREE.Vector3(-14, 0, 36), new THREE.Vector3(-26, 0, 20),
  new THREE.Vector3(-30, 0, 2), new THREE.Vector3(-18, 0, -14),
];
pathPts.forEach(p => p.y = Math.max(heightAt(p.x, p.z), 0) + 0.15);
const pathCurve = new THREE.CatmullRomCurve3(pathPts, true, "catmullrom", 0.35);
const pathLen = pathCurve.getLength();

const pathMesh = new THREE.Mesh(
  new THREE.TubeGeometry(pathCurve, 420, 0.85, 7, true),
  new THREE.MeshStandardMaterial({ color: 0xd9b98a, flatShading: true, roughness: 1 })
);
pathMesh.position.y = 0.25;
scene.add(pathMesh);

/* ---------------- trees ---------------- */
const TREES = 260;
const trunkGeo = new THREE.CylinderGeometry(0.16, 0.24, 1.2, 6);
const leafGeo1 = new THREE.ConeGeometry(1.05, 2.0, 7);
const leafGeo2 = new THREE.ConeGeometry(0.72, 1.5, 7);
const trunkMesh = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x7a5230, flatShading: true, roughness: 1 }), TREES);
const leafA = new THREE.InstancedMesh(leafGeo1, new THREE.MeshStandardMaterial({ color: 0x2f9e57, flatShading: true, roughness: 0.96 }), TREES);
const leafB = new THREE.InstancedMesh(leafGeo2, new THREE.MeshStandardMaterial({ color: 0x3fc06e, flatShading: true, roughness: 0.96 }), TREES);
trunkMesh.castShadow = leafA.castShadow = leafB.castShadow = true;
const m4 = new THREE.Matrix4();
const q = new THREE.Quaternion();
const sVec = new THREE.Vector3();
const YAXIS = new THREE.Vector3(0, 1, 0);
const tmpV = new THREE.Vector3();
let placed = 0, guard = 0;
while (placed < TREES && guard++ < 5000) {
  const x = (Math.random() - 0.5) * TSIZE * 0.9;
  const z = (Math.random() - 0.5) * TSIZE * 0.9;
  const y = heightAt(x, z);
  if (y < 0.4 || y > 10) continue;
  let nearPath = false;
  for (let k = 0; k < 40; k++) {
    const p = pathCurve.getPointAt((k + 0.5) / 40, tmpV);
    if (Math.hypot(p.x - x, p.z - z) < 4.5) { nearPath = true; break; }
  }
  if (nearPath) continue;
  const s = 0.8 + Math.random() * 0.9;
  q.setFromAxisAngle(YAXIS, Math.random() * 6.28);
  m4.compose(new THREE.Vector3(x, y + 0.55 * s, z), q, sVec.set(s, s, s));
  trunkMesh.setMatrixAt(placed, m4);
  m4.compose(new THREE.Vector3(x, y + 1.9 * s, z), q, sVec.set(s, s, s));
  leafA.setMatrixAt(placed, m4);
  m4.compose(new THREE.Vector3(x, y + 3.0 * s, z), q, sVec.set(s, s, s));
  leafB.setMatrixAt(placed, m4);
  placed++;
}
[trunkMesh, leafA, leafB].forEach(m => { m.count = placed; m.instanceMatrix.needsUpdate = true; });
scene.add(trunkMesh, leafA, leafB);

/* ---------------- rocks ---------------- */
const rocks = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.55, 0),
  new THREE.MeshStandardMaterial({ color: 0x8d94a5, flatShading: true, roughness: 1 }), 90);
rocks.castShadow = true;
for (let i = 0; i < 90; i++) {
  const x = (Math.random() - 0.5) * TSIZE * 0.85, z = (Math.random() - 0.5) * TSIZE * 0.85;
  const y = heightAt(x, z);
  const s = 0.5 + Math.random() * 1.7;
  q.setFromEuler(new THREE.Euler(Math.random() * 0.6, Math.random() * 6.28, Math.random() * 0.6));
  m4.compose(new THREE.Vector3(x, y + 0.12 * s, z), q, sVec.set(s, s * 0.8, s));
  rocks.setMatrixAt(i, m4);
}
scene.add(rocks);

/* ---------------- clouds ---------------- */
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1, transparent: true, opacity: 0.92 });
const clouds = [];
for (let i = 0; i < 12; i++) {
  const g = new THREE.Group();
  const parts = 3 + Math.floor(Math.random() * 3);
  for (let k = 0; k < parts; k++) {
    const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2 + Math.random() * 2.4, 0), cloudMat);
    puff.position.set(k * 3.2 - parts * 1.6, Math.random() * 1.2, Math.random() * 2 - 1);
    puff.scale.y = 0.55;
    g.add(puff);
  }
  g.position.set((Math.random() - 0.5) * 300, 34 + Math.random() * 18, (Math.random() - 0.5) * 300);
  scene.add(g);
  clouds.push(g);
}

/* ---------------- birds ---------------- */
const birdMat = new THREE.MeshStandardMaterial({ color: 0x2a3244, flatShading: true, side: THREE.DoubleSide });
const birds = [];
for (let i = 0; i < 7; i++) {
  const b = new THREE.Group();
  const wl = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.34), birdMat);
  const wr = wl.clone();
  wl.position.x = -0.52; wr.position.x = 0.52;
  b.add(wl, wr);
  b.userData = { wl, wr, ph: Math.random() * 6.28, r: 34 + Math.random() * 40, y: 20 + Math.random() * 10, sp: 0.05 + Math.random() * 0.04 };
  scene.add(b);
  birds.push(b);
}

/* ---------------- the boy ---------------- */
function makeBox(w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85 }));
  m.castShadow = true;
  return m;
}
const skin = 0xf0c090, shirt = 0xe2574c, pantsC = 0x2e4a7a, hairC = 0x2b2118, packC = 0xd9a441;

const boy = new THREE.Group();
const hips = new THREE.Group();
hips.position.y = 1.06;
boy.add(hips);

const torso = makeBox(0.62, 0.72, 0.36, shirt);
torso.position.y = 0.36;
hips.add(torso);

const neck = makeBox(0.16, 0.12, 0.16, skin);
neck.position.y = 0.78;
hips.add(neck);
const head = makeBox(0.44, 0.42, 0.42, skin);
head.position.y = 1.02;
hips.add(head);
const hairTop = makeBox(0.48, 0.16, 0.46, hairC);
hairTop.position.y = 1.25;
hips.add(hairTop);
const hairBack = makeBox(0.48, 0.24, 0.16, hairC);
hairBack.position.set(0, 1.12, -0.19);
hips.add(hairBack);

const backPack = makeBox(0.44, 0.5, 0.24, packC);
backPack.position.set(0, 0.42, -0.33);
hips.add(backPack);

function makeLimb(w, l, color, px, py) {
  const pivot = new THREE.Group();
  pivot.position.set(px, py, 0);
  const seg = makeBox(w, l, w, color);
  seg.position.y = -l / 2;
  pivot.add(seg);
  return pivot;
}
const legL = makeLimb(0.2, 0.66, pantsC, -0.17, 1.06);
const legR = makeLimb(0.2, 0.66, pantsC, 0.17, 1.06);
const armL = makeLimb(0.16, 0.55, shirt, -0.41, 0.64);
const armR = makeLimb(0.16, 0.55, shirt, 0.41, 0.64);
boy.add(legL, legR, armL, armR);
scene.add(boy);

/* ---------------- cinematic camera ---------------- */
const sState = { pos: new THREE.Vector3(), tan: new THREE.Vector3(0, 0, 1), side: new THREE.Vector3(1, 0, 0) };
const SHOTS = [
  { name: "Wide establishing", dur: 10,
    get: (s, p, l) => { p.copy(s.pos).addScaledVector(s.tan, 14).addScaledVector(s.side, 17).setY(s.pos.y + 11); l.copy(s.pos).setY(s.pos.y + 1.5); } },
  { name: "Side tracking", dur: 9,
    get: (s, p, l) => { p.copy(s.pos).addScaledVector(s.side, 7.5).setY(s.pos.y + 2.2).addScaledVector(s.tan, 1.5); l.copy(s.pos).setY(s.pos.y + 1.2); } },
  { name: "Front dolly", dur: 8,
    get: (s, p, l) => { p.copy(s.pos).addScaledVector(s.tan, -5.5).addScaledVector(s.side, 2.6).setY(s.pos.y + 2.6); l.copy(s.pos).setY(s.pos.y + 1.25); } },
  { name: "Low angle hero", dur: 8,
    get: (s, p, l) => { p.copy(s.pos).addScaledVector(s.tan, 3.5).addScaledVector(s.side, 3.0).setY(s.pos.y + 0.8); l.copy(s.pos).addScaledVector(s.tan, 8).setY(s.pos.y + 2.2); } },
];
let shotIdx = 0, shotT = 0, blend = 1;
const camPos = new THREE.Vector3(24, 18, 24), camLook = new THREE.Vector3();
const prevPos = camPos.clone(), prevLook = camLook.clone();
const tmpPos = new THREE.Vector3(), tmpLook = new THREE.Vector3();
const shotLabel = document.getElementById("shotLabel");

function showShotLabel() {
  shotLabel.textContent = SHOTS[shotIdx].name + " — " + SHOTS[shotIdx].dur + "s";
  shotLabel.style.opacity = 1;
  clearTimeout(shotLabel._t);
  shotLabel._t = setTimeout(() => { shotLabel.style.opacity = 0; }, 2400);
}
function switchShot(next) {
  prevPos.copy(camPos);
  prevLook.copy(camLook);
  shotIdx = (shotIdx + (next === undefined ? 1 : next) + SHOTS.length) % SHOTS.length;
  blend = 0;
  showShotLabel();
}

/* ---------------- interaction ---------------- */
const fadeDiv = document.getElementById("fade");
let started = false;
document.getElementById("start").addEventListener("click", () => {
  const startEl = document.getElementById("start");
  started = true;
  document.getElementById("bgm").play().catch(() => {});
  startEl.style.transition = "opacity .7s";
  startEl.style.opacity = 0;
  setTimeout(() => { startEl.style.display = "none"; }, 720);
  fadeDiv.style.opacity = 0;
  showShotLabel();
});
addEventListener("click", () => { if (started && blend > 0.6) switchShot(); });
addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "m") document.getElementById("bgm").muted = !document.getElementById("bgm").muted;
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- main loop ---------------- */
const params = new URLSearchParams(location.search);
const OFFLINE = params.has("render");
const clock = !OFFLINE ? new THREE.Clock() : null;
const WALK_SPEED = 2.1;
const sunOffset = new THREE.Vector3(28, 44, 18);
let uDist = 0, simT = 0;

function simulate(dt, t) {
  if (started) uDist += dt * WALK_SPEED;
  const u = (uDist / pathLen) % 1;

  pathCurve.getPointAt(u, sState.pos);
  pathCurve.getTangentAt(u, sState.tan).normalize();
  sState.side.crossVectors(new THREE.Vector3(0, 1, 0), sState.tan).normalize();
  sState.pos.y += 0.02;

  const gait = t * 7.2;
  const sw = Math.sin(gait);
  legL.rotation.x = sw * 0.72;
  legR.rotation.x = -sw * 0.72;
  armL.rotation.x = -sw * 0.5;
  armR.rotation.x = sw * 0.5;
  hips.position.y = 1.06 + Math.abs(Math.sin(gait)) * 0.07;
  hips.rotation.y = sw * 0.07;
  boy.position.copy(sState.pos);
  boy.rotation.y = Math.atan2(sState.tan.x, sState.tan.z);

  sun.position.copy(sState.pos).add(sunOffset);
  sun.target.position.copy(sState.pos);

  clouds.forEach((c, i) => {
    c.position.x += dt * (1.0 + (i % 4) * 0.18);
    if (c.position.x > 170) c.position.x = -170;
  });

  birds.forEach((b) => {
    const d = b.userData;
    const a = t * d.sp + d.ph;
    b.position.set(Math.cos(a) * d.r, d.y + Math.sin(t * 0.6 + d.ph) * 2.5, Math.sin(a) * d.r);
    b.rotation.y = -a;
    const flap = Math.sin(t * 9 + d.ph) * 0.7;
    d.wl.rotation.z = flap;
    d.wr.rotation.z = -flap;
  });

  if (started) {
    shotT += dt;
    if (shotT > SHOTS[shotIdx].dur) { shotT = 0; switchShot(); }
    if (blend < 1) blend = Math.min(1, blend + dt / 1.1);
  }
  SHOTS[shotIdx].get(sState, tmpPos, tmpLook);
  const e = blend * blend * (3 - 2 * blend);
  camPos.lerpVectors(prevPos, tmpPos, e);
  camLook.lerpVectors(prevLook, tmpLook, e);
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  renderer.render(scene, camera);
}
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  simulate(dt, clock.elapsedTime);
}
if (OFFLINE) {
  renderer.setPixelRatio(1);
  const h = parseInt(params.get("h") || "720");
  renderer.setSize(Math.round(h * 16 / 9), h, false);
  if (params.get("shadows") !== "1") renderer.shadowMap.enabled = false;
  window.__start = () => {
    started = true;
    fadeDiv.style.opacity = 0;
    document.getElementById("start").style.display = "none";
  };
  window.__step = (dts) => { simT += dts; simulate(dts, simT); };
} else {
  animate();
}
SHOTS[0].get(sState, camPos, camLook);
prevPos.copy(camPos);
prevLook.copy(camLook);
simulate(0, 0);
</script>
</body>
</html>
